# =============================================
# Server
# =============================================
spring.application.name=ngo-project
server.port=8080

# =============================================
# MySQL Database
# =============================================

spring.datasource.url=jdbc:mysql://localhost:3306/ngo_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT
# =============================================
app.jwt.secret=NGOPlatformSuperSecretKey2024ThisShouldBeLongEnoughForHS256Algorithm
app.jwt.expiration=86400000
