<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Check-In</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f7f7;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      width: min(92vw, 420px);
    }
    h1 { margin-top: 0; }
    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #2d6a4f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #msg {
      margin-top: 16px;
      line-height: 1.5;
      color: #333;
      white-space: pre-wrap;
    }
    .small { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Event Check-In</h1>
    <div class="small" id="tokenText"></div>
    <button onclick="checkIn()">Mark Attendance</button>
    <div id="msg"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const msg = document.getElementById('msg');
    const tokenText = document.getElementById('tokenText');

    if (!token) {
      msg.textContent = 'QR token missing.';
    } else {
      tokenText.textContent = 'QR token loaded successfully.';
    }

    async function checkIn() {
      if (!token) {
        msg.textContent = 'QR token missing.';
        return;
      }

      const jwt = localStorage.getItem('token');
      if (!jwt) {
        msg.textContent = 'Please log in in the main app first, then scan again from the same browser.';
        return;
      }

      msg.textContent = 'Checking in...';

      try {
        const res = await fetch('/api/attendance/checkin/' + encodeURIComponent(token), {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + jwt,
            'Content-Type': 'application/json'
          }
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'Check-in failed');
        }

        msg.textContent =
          data.message + '\n\nEvent: ' + data.eventTitle +
          '\nName: ' + data.userName +
          '\nTime: ' + data.checkedInAt;
      } catch (e) {
        msg.textContent = e.message;
      }
    }
  </script>
</body>
</html>
